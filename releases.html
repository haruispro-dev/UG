<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Releases — UNDERGROUND GEO</title>
<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>
<header class="ug-nav" id="ugNav"></header>
<div class="mobile-backdrop" id="mobileBackdrop"></div>
<div class="mobile-panel" id="mobilePanel"></div>
<div class="container" style="padding-top:30px">
  <div class="section-head">
    <div><h1>Releases</h1><div class="sub">New music from the UG scene.</div></div>
    <a href="upload.html?type=release" class="btn btn-primary btn-sm">Upload release</a>
  </div>
  <div class="grid" id="grid"><div class="empty-state"><div class="spinner"></div></div></div>
</div>
<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/app.js"></script>
<script>
async function load() {
  await UGApp.init('releases');
  const { data } = await sb.from('releases').select('*, profiles:artist_id(username, display_name)').order('created_at', { ascending:false });
  const grid = document.getElementById('grid');
  if (!data?.length) { grid.innerHTML = '<div class="empty-state">No releases yet. Be the first to drop one.</div>'; return; }
  grid.innerHTML = data.map(r => `
    <a class="card" href="release.html?id=${r.id}">
      <div class="card-cover"><img src="${r.cover_url || 'assets/default-cover.svg'}"></div>
      <div class="card-body"><div class="card-title">${UGApp.escapeHtml(r.title)}</div><div class="card-sub">${UGApp.escapeHtml(r.profiles?.display_name||'')}</div></div>
    </a>`).join('');
}
load();
</script>
</body>
</html>
