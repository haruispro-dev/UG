<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Featured — UNDERGROUND GEO</title>
<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>
<header class="ug-nav" id="ugNav"></header>
<div class="mobile-backdrop" id="mobileBackdrop"></div>
<div class="mobile-panel" id="mobilePanel"></div>
<div class="container" style="padding-top:30px">
  <h1>Featured</h1>
  <div class="sub" style="color:var(--text-dim);margin-bottom:20px">Picked by the UG team.</div>
  <div id="root"><div class="empty-state"><div class="spinner"></div></div></div>
</div>
<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/app.js"></script>
<script src="js/hud.js"></script>
<script>
async function load() {
  await UGApp.init('featured');
  const [{ data: releases }, { data: beats }, { data: posts }] = await Promise.all([
    sb.from('releases').select('*, profiles:artist_id(username, display_name)').eq('featured', true).order('created_at', { ascending:false }),
    sb.from('beats').select('*, profiles:producer_id(username, display_name)').eq('featured', true).order('created_at', { ascending:false }),
    sb.from('posts').select('*, profiles:author_id(username, display_name, avatar_url)').eq('featured', true).order('created_at', { ascending:false })
  ]);
  const root = document.getElementById('root');
  const sections = [
    ['Releases', releases, r => `<a class="card" href="release.html?id=${r.id}"><div class="card-cover"><img src="${r.cover_url||'assets/default-cover.svg'}"></div><div class="card-body"><div class="card-title">${UGApp.escapeHtml(r.title)}</div><div class="card-sub">${UGApp.escapeHtml(r.profiles?.display_name||'')}</div></div></a>`],
    ['Beats', beats, b => `<a class="card" href="beat.html?id=${b.id}"><div class="card-cover"><img src="${b.cover_url||'assets/default-cover.svg'}"></div><div class="card-body"><span class="badge alt">${b.bpm} BPM</span><div class="card-title">${UGApp.escapeHtml(b.name)}</div><div class="card-sub">${UGApp.escapeHtml(b.profiles?.display_name||'')}</div></div></a>`],
    ['Community', posts, p => `<a class="card" href="post.html?id=${p.id}"><div class="card-body"><span class="badge alt">${p.category}</span><div class="card-title">${UGApp.escapeHtml(p.title)}</div><div class="card-sub">${UGApp.escapeHtml(p.profiles?.display_name||'')}</div></div></a>`]
  ];
  const html = sections.filter(([,items]) => items && items.length).map(([title,items,render]) => `
    <section class="section" data-anim><div class="section-head"><h2>${title}</h2></div><div class="grid">${items.map(render).join('')}</div></section>
  `).join('');
  root.innerHTML = html || '<div class="empty-state">Nothing featured yet — check back soon.</div>';
  UGApp.observeSections();
}
load();
</script>
</body>
</html>
