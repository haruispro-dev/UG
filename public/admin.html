<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UG Admin</title><link rel="stylesheet" href="/styles.css"></head><body><main><section><p class="eyebrow">PRIVATE CONTROL CENTER</p><h1>UG ADMIN</h1><div id="app"></div></section></main><script>
const $=s=>document.querySelector(s);async function api(u,o={}){let r=await fetch(u,o),d=await r.json();if(!r.ok)throw Error(d.error);return d}
function login(){ $("#app").innerHTML='<form class="form" onsubmit="doLogin(event)"><input name="login" placeholder="Admin email"><input name="password" type="password" placeholder="Password"><button class="btn redbtn">Login</button></form>'}
async function doLogin(e){e.preventDefault();let o=Object.fromEntries(new FormData(e.target));try{await api("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(o)});dashboard()}catch(x){alert(x.message)}}
async function dashboard(){let b=await api("/api/bootstrap");$("#app").innerHTML='<h2>Everything control</h2><p class="muted">Upload real files, update settings, and manage content.</p><form class="form" enctype="multipart/form-data" onsubmit="upload(event)"><input name="title" placeholder="Resource title" required><select name="category"><option>Plugins</option><option>Presets</option><option>DAWs</option></select><textarea name="description" placeholder="Description"></textarea><input type="file" name="file" required><input type="file" name="image"><button class="btn redbtn">Upload resource</button></form><hr><form class="form" onsubmit="settings(event)"><input name="heroText" value="'+(b.settings.heroText||"")+'" placeholder="Hero text"><input name="discordInvite" value="'+(b.settings.discordInvite||"")+'" placeholder="Discord invite"><button class="btn">Save settings</button></form><hr><button class="btn" onclick="location.href='/'">Public website</button>'}
async function upload(e){e.preventDefault();let r=await fetch("/api/resources",{method:"POST",body:new FormData(e.target)});let d=await r.json();alert(d.error||"Uploaded");if(r.ok)dashboard()}
async function settings(e){e.preventDefault();let o=Object.fromEntries(new FormData(e.target));await api("/api/admin/settings",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(o)});alert("Saved")}
login()
</script></body></html>
