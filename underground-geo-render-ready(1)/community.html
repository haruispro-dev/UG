<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Community — UNDERGROUND GEO</title>
<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>
<header class="ug-nav" id="ugNav"></header>
<div class="mobile-backdrop" id="mobileBackdrop"></div>
<div class="mobile-panel" id="mobilePanel"></div>
<div class="container" style="padding-top:30px;max-width:760px">
  <div class="section-head">
    <div><h1>Community</h1><div class="sub">Discussions, feedback, and collab calls from the scene.</div></div>
    <div style="display:flex;gap:8px">
      <select id="sortSelect" style="padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--bg)">
        <option value="latest">Latest</option>
        <option value="popular">Popular</option>
      </select>
      <a href="upload.html?type=post" class="btn btn-primary btn-sm">New post</a>
    </div>
  </div>
  <div id="feed"><div class="empty-state"><div class="spinner"></div></div></div>
</div>
<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/app.js"></script>
<script src="js/hud.js"></script>
<script>
async function load() {
  await UGApp.init('community');
  const sort = document.getElementById('sortSelect').value;
  const { data: posts } = await sb.from('posts').select('*, profiles:author_id(username, display_name, avatar_url)').order('created_at', { ascending:false });
  let list = posts || [];
  list = [...list].sort((a,b) => (b.pinned?1:0) - (a.pinned?1:0));
  if (sort === 'popular') {
    const { data: reactions } = await sb.from('reactions').select('target_id').eq('target_type','post');
    const counts = {};
    (reactions||[]).forEach(r => counts[r.target_id] = (counts[r.target_id]||0)+1);
    list = [...list].sort((a,b) => (counts[b.id]||0) - (counts[a.id]||0));
  }
  const feed = document.getElementById('feed');
  if (!list.length) { feed.innerHTML = '<div class="empty-state">No posts yet — start the conversation.</div>'; return; }
  feed.innerHTML = list.map(p => `
    <a class="card" href="post.html?id=${p.id}" style="display:block;padding:16px;margin-bottom:12px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
        <img src="${p.profiles?.avatar_url || 'assets/default-avatar.svg'}" style="width:24px;height:24px;border-radius:50%;object-fit:cover">
        <span style="font-size:.85rem">${UGApp.escapeHtml(p.profiles?.display_name||'Member')}</span>
        <span class="comment-time">· ${UGApp.timeAgo(p.created_at)}</span>
        <span class="badge alt" style="margin-left:auto">${p.category}</span>
      </div>
      <div class="card-title">${UGApp.escapeHtml(p.title)}</div>
      ${p.content ? `<div class="card-sub" style="margin-top:4px">${UGApp.escapeHtml(p.content.slice(0,140))}</div>` : ''}
      ${p.image_url ? `<img src="${p.image_url}" style="margin-top:10px;border-radius:8px;max-height:220px;object-fit:cover;width:100%">` : ''}
    </a>`).join('');
}
document.getElementById('sortSelect').addEventListener('change', load);
load();
</script>
</body>
</html>
