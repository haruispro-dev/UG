<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile — UNDERGROUND GEO</title>
<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>
<header class="ug-nav" id="ugNav"></header>
<div class="mobile-backdrop" id="mobileBackdrop"></div>
<div class="mobile-panel" id="mobilePanel"></div>

<div class="container" id="profileRoot">
  <div class="empty-state"><div class="spinner"></div></div>
</div>

<div class="modal-overlay" id="contactModal">
  <div class="modal">
    <h3 id="contactModalTitle">Send a message</h3>
    <div class="field"><textarea id="contactMessage" rows="4" placeholder="Say hello…"></textarea></div>
    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button class="btn btn-ghost" onclick="document.getElementById('contactModal').classList.remove('open')">Cancel</button>
      <button class="btn btn-primary" id="sendContactBtn">Send</button>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/app.js"></script>
<script>
let targetProfile, contactKind = 'contact';

async function load() {
  await UGApp.init();
  const username = new URLSearchParams(location.search).get('u');
  const { data: p } = await sb.from('profiles').select('*').eq('username', username).single();
  const root = document.getElementById('profileRoot');
  if (!p) { root.innerHTML = '<div class="empty-state">Profile not found.</div>'; return; }
  targetProfile = p;

  const [{ data: releases }, { data: beats }, { data: posts }] = await Promise.all([
    sb.from('releases').select('*').eq('artist_id', p.id).order('created_at', { ascending:false }),
    sb.from('beats').select('*').eq('producer_id', p.id).order('created_at', { ascending:false }),
    sb.from('posts').select('*').eq('author_id', p.id).order('created_at', { ascending:false })
  ]);

  const links = [
    ['youtube_url','YouTube'], ['spotify_url','Spotify'], ['soundcloud_url','SoundCloud'],
    ['instagram_url','Instagram'], ['tiktok_url','TikTok'], ['beatstars_url','BeatStars']
  ].filter(([key]) => p[key]).map(([key,label]) => `<a class="link-pill" href="${p[key]}" target="_blank">${label}</a>`).join('');

  const isOwn = window.UG.user && window.UG.user.id === p.id;

  root.innerHTML = `
    <div class="profile-header" data-anim>
      <img class="avatar" src="${p.avatar_url || 'assets/default-avatar.svg'}">
      <div>
        <span class="badge">${p.account_type}</span>
        <h1>${UGApp.escapeHtml(p.display_name)}</h1>
        <div style="color:var(--text-dim)">@${p.username}${p.collab_availability ? ' · <span style="color:var(--accent)">Open to collab</span>' : ''}</div>
        <p style="max-width:520px">${UGApp.escapeHtml(p.bio || '')}</p>
        <div class="profile-links">${links}</div>
        ${!isOwn && window.UG.user ? `
          <div style="margin-top:14px;display:flex;gap:10px">
            <button class="btn btn-ghost btn-sm" onclick="openContact('contact')">Contact</button>
            ${p.account_type !== 'member' ? `<button class="btn btn-primary btn-sm" onclick="openContact('collab')">Collab</button>` : ''}
          </div>` : ''}
        ${isOwn ? `<div style="margin-top:14px"><a href="settings.html" class="btn btn-ghost btn-sm">Edit profile</a></div>` : ''}
      </div>
    </div>

    ${releases?.length ? `<section class="section" data-anim><div class="section-head"><h2>Releases</h2></div><div class="grid">
      ${releases.map(r => `<a class="card" href="release.html?id=${r.id}">
        <div class="card-cover"><img src="${r.cover_url || 'assets/default-cover.svg'}"></div>
        <div class="card-body"><div class="card-title">${UGApp.escapeHtml(r.title)}</div></div></a>`).join('')}
    </div></section>` : ''}

    ${beats?.length ? `<section class="section" data-anim><div class="section-head"><h2>Beats</h2></div><div class="grid">
      ${beats.map(b => `<a class="card" href="beat.html?id=${b.id}">
        <div class="card-cover"><img src="${b.cover_url || 'assets/default-cover.svg'}"></div>
        <div class="card-body"><div class="card-title">${UGApp.escapeHtml(b.name)}</div><div class="card-sub">${b.bpm} BPM · ${UGApp.escapeHtml(b.key)}</div></div></a>`).join('')}
    </div></section>` : ''}

    ${posts?.length ? `<section class="section" data-anim><div class="section-head"><h2>Community posts</h2></div><div class="grid">
      ${posts.map(pp => `<a class="card" href="post.html?id=${pp.id}"><div class="card-body">
        <div class="card-title">${UGApp.escapeHtml(pp.title)}</div><div class="card-sub">${UGApp.timeAgo(pp.created_at)}</div></div></a>`).join('')}
    </div></section>` : ''}
  `;
  UGApp.observeSections();
}

function openContact(kind) {
  contactKind = kind;
  document.getElementById('contactModalTitle').textContent = kind === 'collab' ? 'Send a collaboration request' : 'Send a message';
  document.getElementById('contactModal').classList.add('open');
}

document.getElementById('sendContactBtn').addEventListener('click', async () => {
  const message = document.getElementById('contactMessage').value.trim();
  const { error } = await sb.from('collab_requests').insert({
    sender_id: window.UG.user.id, receiver_id: targetProfile.id, kind: contactKind, message
  });
  if (!error) {
    await sb.from('notifications').insert({
      user_id: targetProfile.id, type: contactKind,
      message: `${window.UG.profile.display_name} sent you a ${contactKind === 'collab' ? 'collaboration request' : 'message'}.`,
      link: `profile.html?u=${window.UG.profile.username}`
    });
  }
  document.getElementById('contactModal').classList.remove('open');
  document.getElementById('contactMessage').value = '';
  alert(error ? 'Could not send: ' + error.message : 'Sent!');
});

load();
</script>
</body>
</html>
